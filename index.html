<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiran Official Website</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* CSS STYLES - MINIMALIST WHITE & BLUE */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6; /* Very light grey background */
            color: #333;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 380px;
            background-color: #ffffff; /* Pure white card */
            padding: 30px;
            text-align: center;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05); /* Very soft shadow */
            box-sizing: border-box;
        }

        /* Website Title */
        .site-title {
            font-size: 24px;
            font-weight: 700;
            color: #0066cc;
            margin-bottom: 20px;
        }

        /* Profile Header Section - Banner Slider */
        .profile-header {
            margin-bottom: 20px;
            position: relative;
            height: 180px;
            overflow: hidden;
            border-radius: 16px;
        }

        .banner-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border: 1px solid #eee;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .banner-img.active {
            opacity: 1;
        }

        /* Date Section */
        .date-display {
            font-size: 14px;
            color: #718096;
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Navigation Buttons - Clean Style */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            gap: 10px;
        }

        .nav-btn {
            background-color: #f0f4f8; /* Light blue-grey */
            border: none;
            padding: 12px 10px;
            border-radius: 12px;
            font-weight: 600;
            color: #4a5568;
            cursor: pointer;
            font-size: 13px;
            flex-grow: 1;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background-color: #0066cc; /* Solid blue */
            color: #fff;
        }

        /* Section Titles */
        .section-title {
            font-weight: 600;
            margin-bottom: 15px;
            display: block;
            color: #2d3748;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: left;
            display: none; /* Hidden by default */
        }

        /* Red Title for Sports News */
        .red-section-title {
            color: #e53e3e; /* Bright Red */
            font-weight: 700;
        }

        /* Content Box Style */
        .content-box {
            background-color: #f0f4f8;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: left;
            border: 1px solid #e2e8f0;
            display: none; /* Initially hidden */
        }

        /* Sports Score Box Specifics */
        .score-box {
            background-color: #fff5f5; /* Light red background */
            border: 1px solid #fed7d7;
        }
        
        .score-header {
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .score-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .team-name {
            font-weight: 600;
        }
        
        .result-text {
            color: #38a169; /* Green for winner */
            font-weight: 600;
            margin-top: 10px;
            font-size: 13px;
        }

        /* Social Media Section */
        .social-icons {
            display: flex;
            justify-content: space-around;
            margin-bottom: 35px;
        }

        .icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 20px;
            text-decoration: none;
            color: #4a5568;
            transition: all 0.3s;
        }
        
        .icon:hover {
            background-color: #0066cc;
            color: #fff;
        }

        /* Contact Section Styles */
        .contact-box {
            background-color: #f0f4f8;
            border-radius: 16px;
            padding: 20px;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .contact-form input, .contact-form textarea {
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            background-color: #fff;
            color: #333;
        }

        .contact-form button {
            background-color: #0066cc;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: background-color 0.3s;
        }

        .contact-form button:hover {
            background-color: #004c99;
        }
    </style>
</head>
<body onload="showContent('news')"> <div class="container">
        <div class="site-title">Kiran Official</div>

        <div class="profile-header">
            <img src="https://i.supaimg.com/b8bd2238-7622-4aaf-9dba-62651c79a281.png" alt="Banner 1" class="banner-img active">
            <img src="https://i.supaimg.com/ae0d3675-35e4-4b0e-9ec1-0ad00a303bc4.png" alt="Banner 2" class="banner-img">
        </div>

        <div class="date-display" id="dateDisplay"></div>

        <div class="nav-buttons">
            <button class="nav-btn" onclick="showContent('news')">NEWS</button>
            <button class="nav-btn" onclick="showContent('education')">EDUCATION</button>
            <button class="nav-btn" onclick="showContent('about')">ABOUT</button>
        </div>
        
        <span class="section-title red-section-title" id="sportsTitle">ICC MEN'S T20 WORLD CUP</span>
        
        <div class="content-box score-box" id="newsContent1">
            <div class="score-header">Group Stage · T20 3 of 55 · Sat, Feb 7</div>
            <div class="score-row">
                <span class="team-name">India (IND)</span>
                <span>161/9 (20)</span>
            </div>
            <div class="score-row">
                <span class="team-name">USA</span>
                <span>132/8 (20)</span>
            </div>
            <div class="result-text">India won by 29 runs</div>
        </div>
        
        <span class="section-title" id="newsLabel">NEWS</span>

        <div class="content-box score-box" id="newsContent2">
            <div class="score-header">Group Stage · T20 2 of 55 · Fri, Feb 6</div>
            <div class="score-row">
                <span class="team-name">West Indies (WI)</span>
                <span>182/5 (20)</span>
            </div>
            <div class="score-row">
                <span class="team-name">Scotland (SCO)</span>
                <span>147 (18.5)</span>
            </div>
            <div class="result-text">WI won by 35 runs</div>
        </div>

        <div class="content-box" id="educationContent">
            <p>No data found.</p>
        </div>

        <div class="content-box" id="aboutContent">
            <div class="social-icons" style="margin-bottom:0;">
                <a href="https://www.facebook.com/share/1Gd4gCavtx/" target="_blank" class="icon"><i class="fab fa-facebook-f"></i></a>
                <a href="https://www.tiktok.com/@ghanshyam.oli66" target="_blank" class="icon"><i class="fab fa-tiktok"></i></a>
                <a href="https://wa.me/9779762596912" target="_blank" class="icon"><i class="fab fa-whatsapp"></i></a>
                <a href="mailto:ghanshyamoli922@gmail.com" class="icon"><i class="far fa-envelope"></i></a>
            </div>
        </div>

        <span class="section-title" id="contactTitle" style="display:block;">CONTACT ME</span>
        <div class="contact-box">
            <form class="contact-form" onsubmit="handleContact(event)">
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <textarea placeholder="Your Message" rows="3" required></textarea>
                <button type="submit">SEND MESSAGE</button>
            </form>
        </div>
    </div>

    <script>
        // JAVASCRIPT - Date Display
        function displayDate() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('dateDisplay').innerText = now.toLocaleDateString('en-US', options);
        }
        displayDate();

        // JAVASCRIPT - Banner Slider Animation (5 seconds)
        let currentBanner = 0;
        const banners = document.querySelectorAll('.banner-img');
        function nextBanner() {
            banners[currentBanner].classList.remove('active');
            currentBanner = (currentBanner + 1) % banners.length;
            banners[currentBanner].classList.add('active');
        }
        setInterval(nextBanner, 5000);

        // JAVASCRIPT - Content Switching
        function showContent(section) {
            // Hide all content boxes
            document.getElementById('newsContent1').style.display = 'none';
            document.getElementById('newsContent2').style.display = 'none';
            document.getElementById('sportsTitle').style.display = 'none';
            document.getElementById('educationContent').style.display = 'none';
            document.getElementById('aboutContent').style.display = 'none';
            document.getElementById('newsLabel').style.display = 'none';

            // Show selected content
            if (section === 'news') {
                document.getElementById('newsContent1').style.display = 'block';
                document.getElementById('newsContent2').style.display = 'block';
                document.getElementById('sportsTitle').style.display = 'block';
                document.getElementById('newsLabel').style.display = 'block';
                document.getElementById('newsLabel').innerText = 'NEWS';
            } else if (section === 'education') {
                document.getElementById('educationContent').style.display = 'block';
            } else if (section === 'about') {
                document.getElementById('aboutContent').style.display = 'block';
            }
        }

        // JAVASCRIPT - Contact Form Handling
        function handleContact(event) {
            event.preventDefault(); // Prevents page reload
            alert('Thank you! Your message has been sent.');
            event.target.reset(); // Clears the form
        }
    </script>

</body>
</html>
